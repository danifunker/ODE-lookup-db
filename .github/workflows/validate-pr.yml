name: Validate PR

on:
  pull_request:
    paths:
      - "data/redump.jsonl"
      - "schema/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Validate JSONL
        run: uv run scripts/validate.py
      - name: Build SQLite (smoke)
        run: uv run scripts/build_sqlite.py --out /tmp/redump.sqlite
